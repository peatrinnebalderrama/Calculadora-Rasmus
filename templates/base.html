<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Inicio{% endblock %} · Rasmus</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <!-- CSS local -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='assets/images/images.png') }}" type="image/png">
</head>
<body>
<!-- Barra superior: solo aparece en pantallas pequeñas -->
<div class="topbar">
  <button type="button" id="btn-menu" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
  <span><i class="bi bi-gear-wide-connected" style="color:var(--rasmus-accent)"></i> Rasmus</span>
</div>
<div class="overlay" id="overlay"></div>

<!-- Barra lateral -->
<aside class="sidebar" id="sidebar">
  <a class="sidebar-brand" href="{{ url_for('inicio') }}">
    <span><i class="bi bi-gear-wide-connected"></i>Rasmus</span>
  </a>

  <a class="sidebar-link {{ 'activo' if request.path == '/' }}" href="{{ url_for('inicio') }}">
    <i class="bi bi-house"></i> Inicio
  </a>

  {% for grupo in ['Decisiones', 'Inventarios'] %}
  <div class="sidebar-grupo">{{ grupo }}</div>
  {% for clave, t in TEMAS.items() if t.grupo == grupo %}
  <a class="sidebar-link {{ 'activo' if request.path == url_for('tema', nombre=clave) }}"
     href="{{ url_for('tema', nombre=clave) }}">
    <i class="bi {{ t.icono }}"></i> {{ t.titulo }}
  </a>
  {% endfor %}
  {% endfor %}

  <div class="sidebar-pie"><br></div>
</aside>

<div class="layout-contenido">
  <main>{% block contenido %}{% endblock %}</main>
  <footer>
    <div class="container">Rasmus · Control de inventario</div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
  // Menú lateral en móvil
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  function alternarMenu(abrir) {
    sidebar.classList.toggle("abierto", abrir);
    overlay.classList.toggle("visible", abrir);
  }
  document.getElementById("btn-menu").addEventListener("click", () => alternarMenu(true));
  overlay.addEventListener("click", () => alternarMenu(false));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
